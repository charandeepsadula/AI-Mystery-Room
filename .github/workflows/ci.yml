name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint --workspace client
      - run: npm run build
      - run: node --check server/index.js
      - run: node --check server/services/gemini.js
      - run: node --check server/models/Case.js
